services:
  platform:
    build: .
    ports:
      - "3005:3005"
    environment:
      # Leave empty (recommended): participants see the end page with the
      # completion code (text in backend/texts/<language>.json, "thankYou").
      # Optional: a link to send participants to automatically instead,
      # "?pid=<participant id>" is added (see README, "Alternative setup").
      RETURN_URL: ""
      # Code shown at the end of the feed. Must be the same as in the Qualtrics
      # validation of the code question ("Is Equal to ...").
      COMPLETION_CODE: "73914"
      # Language of all texts participants see: "en" or "de"
      # (= file name in backend/texts/, e.g. "de" uses backend/texts/de.json)
      LANGUAGE: "en"
    volumes:
      # Study results (CSV files) are written here on the host machine
      - ./data:/app/backend/data
      # Participant-facing texts: edit these files, then run "docker compose restart"
      - ./backend/texts:/app/backend/texts:ro
    restart: unless-stopped
