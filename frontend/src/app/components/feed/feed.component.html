        <svg fill="currentColor" height="24" viewBox="0 0 24 24" width="24">
          <path d="M12.003 2.001a9.705 9.705 0 1 1 0 19.4 10.876 10.876 0 0 1-2.895-.384.798.798 0 0 0-.533.04l-1.984.876a.801.801 0 0 1-1.123-.708l-.054-1.78a.806.806 0 0 0-.27-.569 9.49 9.49 0 0 1-3.14-7.175 9.65 9.65 0 0 1 10-9.7Z" fill="none" stroke="currentColor" stroke-miterlimit="10" stroke-width="1.739"></path>

        </svg>
      </button>
    </div>
  </div>
</nav>

<!-- Feed Content -->
@if (feedState() === 'viewing') {
  <main class="feed-container">
    @for (post of currentBlockPosts(); track post.postId) {
      <app-post-card [post]="post" />
    }

    <!-- Continue to survey button after last post -->
    @if (currentBlockPosts().length > 0) {
      <div class="block-end">
        <button class="continue-btn" (click)="openSurvey()">
          <span>Kurze Zwischenfrage</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    }
  </main>
}

<!-- Survey Overlay -->
@if (feedState() === 'survey') {
  <app-block-survey
    [blockPosts]="currentBlockPosts()"
    [blockNumber]="currentBlock()"
    [themes]="themes()"
    (completed)="onSurveyCompleted($event)" />
}

<!-- Bottom Navigation Bar -->
