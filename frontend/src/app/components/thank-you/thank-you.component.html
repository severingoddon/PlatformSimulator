<div class="thank-you-wrapper">
  <div class="thank-you-container">
    <div class="check-circle">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" fill="#0095f6"/>
        <path d="M17 9L10.5 15.5L7 12" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 class="title">{{ texts.thankYou.title }}</h1>
    <p class="message">{{ texts.thankYou.message }}</p>

    <div class="code-box">
      <span class="code-label">{{ texts.thankYou.codeLabel }}</span>
      <span class="code" aria-live="polite">{{ code }}</span>
      <button class="copy-btn" [class.copied]="copied()" (click)="copyCode()">
        {{ copied() ? texts.thankYou.copied : texts.thankYou.copyButton }}
      </button>
    </div>

    <ol class="steps">
      <li>{{ texts.thankYou.step1 }}</li>
      <li>{{ texts.thankYou.step2 }}</li>
      <li>{{ texts.thankYou.step3 }}</li>
    </ol>

    @if (canGoBack()) {
      <button class="back-btn" (click)="backToSurvey()">{{ texts.thankYou.backButton }}</button>
    } @else {
      <p class="tab-hint">{{ texts.thankYou.tabHint }}</p>
    }
  </div>
</div>
